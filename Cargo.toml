[package]
name = "kaimei"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
iroh = "1.3.0"
iroh-ping = "1.0.0"
iroh-tickets = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace]
resolver = "3"
members = [".", "buttplug-client/"]
